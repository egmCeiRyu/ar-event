<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

    <title>Character AR</title>

    <link rel="stylesheet" href="css/character-ar.css">

    <script
        crossorigin="anonymous"
        src="./external/scripts/8frame-1.5.0.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
        crossorigin="anonymous"
        async
        data-preload-chunks="slam">
    </script>

    <script type="module" src="js/character-ar.js"></script>
</head>

<body>

    <a id="homeButton" class="home-button" href="character-list.html" aria-label="キャラクター一覧へ戻る">
        🏠
    </a>

    <div id="targetOverlay">
        <div id="targetHint">
            キャラクターを準備しています...
        </div>
    </div>

    <button id="captureBtn" type="button" aria-label="撮影">
        <span id="captureIcon"></span>
    </button>

    <a-scene
        character-ar-controller

        landing-page
        xrextras-loading
        xrextras-runtime-error
        xrextras-gesture-detector

        renderer="colorManagement:true; antialias:false; alpha:true"
        xrweb="
            allowedDevices:any;
            defaultEnvironmentFogIntensity:0.3;
            defaultEnvironmentFloorColor:#ffffff;
            defaultEnvironmentSkyBottomColor:#B4C4CC;
            defaultEnvironmentSkyTopColor:#5ac8fa;
            defaultEnvironmentSkyGradientStrength:0.5;
        "
    >

        <a-assets>
        </a-assets>

        <a-camera
            id="camera"
            position="0 1.6 0"
            raycaster="objects: .cantap"
            cursor="fuse:false; rayOrigin:mouse;">
        </a-camera>

        <a-light type="ambient" intensity="0.85"></a-light>

        <a-entity
            id="mainCharacter"
            class="cantap"
            visible="false"
            scale="1 1 1"
            rotation="0 0 0"
            position="0 0 -2"

            xrextras-hold-drag
            xrextras-pinch-scale>
        </a-entity>

        <a-box
            id="ground"
            scale="20 1 20"
            position="0 -0.05 0"
            visible="false">
        </a-box>

    </a-scene>

</body>

</html>
